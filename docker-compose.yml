version: '3.8'

services:
  # Knowledge Graph Chatbot API
  knowledge-graph-chatbot:
    build: .
    container_name: kg-chatbot-api
    ports:
      - "8000:8000"
    environment:
      # Neo4j Configuration
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      
      # Vector Database Configuration
      - VECTOR_DB_FOLDER=/app/vector_db
      - VECTOR_MODEL_NAME=all-MiniLM-L6-v2
      
      # File Processing Configuration
      - TEMP_FOLDER=/app/temp_files
      - CSV_FOLDER=/app/temp_files/csvs
      - MAX_FILE_SIZE_MB=100
      
      # LLM Configuration (you'll need to set these)
      - BEDROCK_MODEL_ID=us.anthropic.claude-sonnet-4-20250514-v1:0
      - LLM_MAX_TOKENS=4000
      - LLM_TEMPERATURE=0
      
      # AWS Credentials (optional - can use AWS CLI/IAM roles instead)
      # - AWS_ACCESS_KEY_ID=your_access_key
      # - AWS_SECRET_ACCESS_KEY=your_secret_key
      # - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ./temp_files:/app/temp_files
      - ./vector_db:/app/vector_db
      - ./logs:/app/logs
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kg-network

  # Neo4j Database
  neo4j:
    image: neo4j:5.15.0
    container_name: kg-neo4j
    ports:
      - "7474:7474"  # Neo4j Browser
      - "7687:7687"  # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password123 'RETURN 1'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - kg-network

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:

networks:
  kg-network:
    driver: bridge
